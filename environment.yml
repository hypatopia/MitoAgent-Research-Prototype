# mito_v2 conda environment
# Pinned with compatible-release constraints; see requirements.txt for the
# rationale and REPRODUCIBILITY.md for the exact validated versions.
name: mito_v2
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.4
  - scipy=1.17
  - matplotlib=3.10
  - pandas=3.0
  - openpyxl=3.1
  - pytest=9.0
  - pip
  - pip:
      - SALib~=1.5
      - streamlit~=1.57
      - plotly~=6.7
